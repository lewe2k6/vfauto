name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.4-ts
          name: "Pin & Nhiệt Độ v5.0.4 — Sửa Triệt Để Tự Bật Lại App Tài Xế Green SM Sau Khi Bắn Map"
          body: "Bản v5.0.4 khắc phục triệt để lỗi đứng lại ở màn hình Pin & Nhiệt Độ sau khi ấn Điều hướng trên Green SM Driver (vn.gsm.md): kiểm tra kép trạng thái Foreground của cả hai app, ưu tiên lấy chính xác Bundle ID gốc vừa gọi URL (vn.gsm.md), ngắt xung đột LaunchServices trong applicationDidBecomeActive:, và phối hợp cả luồng UI lẫn tiến trình root pind --return-to-app để tự động bật ngược về màn hình cuốc xe Green SM 100%."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
