name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.9-ts
          name: "Pin & Nhiệt Độ v4.9 Tự Chữa Lành Lõi Ngầm & Chống Sót Đơn Tuyệt Đối"
          body: "Bản vá trọng điểm v4.9: (1) Sửa triệt để lỗi cài đè TrollStore đổi thư mục UUID làm Watchdog gọi nhầm đường dẫn cũ gây đơ quét/chạm (Watchdog nay tự phát hiện đổi UUID và chuyển giao sang binary mới tức thì, không bao giờ phải gỡ cài lại); (2) Khắc phục hiện tượng tự hủy làm mới RAM liên tục mỗi 90s sau khi nạp DB 3 Sàn 74.496 quán; (3) Sửa lỗi thanh đếm ngược 2 màu cắt đôi chữ 'Nhận | chuyến' trong Vision OCR + bổ sung nhận diện đủ dịch vụ (Bike Tiết kiệm/Ưu tiên, Express 2H/Đơn ghép/Đồng giá) + quét 4 hàng pixel đáy + chống khóa 4.2s khi chạm trượt nút Nhận; (4) Gỡ toàn bộ phụ thuộc UIKit khỏi pind chạy ngầm, tự làm mới FrontBoard monitor định kỳ 25s và hủy ngủ nghỉ 2 phút ngay khi phát hiện vẫn đang Trực tuyến."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
