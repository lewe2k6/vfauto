name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.8-ts
          name: "Pin & Nhiệt Độ v5.0.8 — Sửa Triệt Để Văng App Khi Mở & Khôi Phục Icon Google Maps"
          body: "Bản v5.0.8 sửa triệt để lỗi văng app khi mở của v5.0.7: (1) Tuyệt đối không bao giờ tự gọi registerApplicationDictionary đè lên chính PinNhietDo.app đang chạy và xóa bỏ lệnh SBReloadIconForIdentifier sai chữ ký C gây crash; (2) Giữ nguyên 100% app.entitlements chuẩn v5.0.6; (3) Chỉ tác động riêng lên com.google.Maps (Maps.app) để khôi phục và giữ icon Google Maps 100% trên màn hình chính iPhone 8."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
