name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.3-ts
          name: "Pin & Nhiệt Độ v5.0.3 — Tương Thích GreenSM 3.18.0 (vn.gsm.md) + Giữ Google Maps Máy 8 + Quét QR Web"
          body: "Bản v5.0.3 nâng cấp: (1) Tương thích chuẩn GreenSMDriver 3.18.0 (CFBundleIdentifier vn.gsm.md, Tài xế Green SM, tự ép chế độ mở bản đồ ngoài .externalApp thay vì .gsmMaps); (2) Giữ nguyên Google Maps trên iPhone 8 — khi BẬT công tắc sẽ tự động bắt comgooglemaps:// bắn sang máy thứ 2 và ngủ 0% RAM, khi TẮT công tắc sẽ trả quyền comgooglemaps:// và chuyển tiếp trực tiếp sang Google Maps ngay trên iPhone 8; (3) Thêm nút Chụp ảnh / Chọn ảnh / Mở Camera quét mã QR kênh kết nối trực tiếp trên trang map.html."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
