name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.8-ts
          name: "Pin & Nhiệt Độ v4.8 Hợp Nhất Dữ Liệu 3 Sàn (74.496 Quán Xanh-Shopee-Grab & 49.261 Ghim HN)"
          body: "Bản nâng cấp dữ liệu lớn v4.8: (1) Hợp nhất dữ liệu liên sàn 74.496 quán ăn Hà Nội (17.014 Xanh SM + 53.602 ShopeeFood + 3.880 GrabFood) vào lõi nhị phân HANOI_FOOD_INDEX_V2 (1.17MB, tra cứu 0.2ms) — vạch trần các quán TTTM/Tầng hầm ẩn tên trên Xanh SM và chuẩn hóa Điểm Đông Liên Sàn (max[Đơn Xanh, Vote Grab x3.2, Điểm Shopee x3.0]); (2) Chống phạt oan thông minh: tự động miễn trừ cụm chỉ hướng 'Đối diện / Cạnh / Gần TTTM' và kiot tầng trệt chung cư cũ; (3) Nâng mật độ ghim tọa độ đường/ngõ/số nhà Hà Nội Offline lên 49.261 điểm giúp đo khoảng cách >3.0km tức thì, bỏ qua gọi mạng ArcGIS khi trúng ghim nhà/ngõ chính xác."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
