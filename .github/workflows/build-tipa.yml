name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.3-ts
          name: "Pin & Nhiệt Độ v3.3 Chuẩn Nối Chuyến (TrollStore iOS 16)"
          body: "Bản v3.3 chuẩn nối chuyến: Đã bỏ reset chốt Điều hướng khi bấm Nhận chuyến (giữ nguyên khóa Map của cuốc đang chở dở khi nổ cuốc nối tiếp), chỉ mở khóa khi tới màn Xác nhận hoàn thành, về Sảnh chờ, hoặc chuyển sang màn Đã đến điểm đón của khách nối tiếp."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
