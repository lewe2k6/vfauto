name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1-ts
          name: "Pin & Nhiệt Độ v4.1 Bản Vá Chuẩn Hạ Nhiệt iOS 16 & Khóa Banner (TrollStore)"
          body: "Bản vá lỗi tinh gọn v4.1 (không thêm tính năng thừa): (1) Vá dứt điểm dò App tiền cảnh trên iOS 15/16 bằng FBSDisplayLayoutMonitorConfiguration + BKSApplicationStateMonitor để tắt sạch 100% OCR khi đang mở Google Maps; (2) Regex ranh giới từ nghiêm ngặt chặn banner '2h' / 'car' nhận nhầm Food thành Express 2H; (3) Khóa mỏ neo tung độ Y nút [X] chuẩn vào tiêu đề Food & tự bấm xác nhận nếu có hộp thoại hỏi từ chối; (4) Chống ghi đè Reset chốt Map/bộ đếm trong lúc nghỉ 2 phút & bảo vệ luồng ghi Log."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
