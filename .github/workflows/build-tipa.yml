name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.1.0-ts
          name: "Pin & Nhiệt Độ v5.1.0 — Khôi Phục Lõi Ngầm Tự Nhận/Hủy Chuyến & Giữ Icon Google Maps"
          body: "Bản v5.1.0 sửa triệt để lỗi Lõi Ngầm pind không tự động nhận/hủy chuyến ở bản v5.0.8/v5.0.9: (1) Khôi phục 100% daemon.entitlements chuẩn v5.0.6 cho tiến trình pind (xóa 4 quyền MobileInstallationHelperService của v5.0.7 làm iOS chặn chạy pind); (2) Bỏ lệnh gọi --stop thừa khi khởi động startFilterDaemonIfNeeded tránh tự giết Watchdog/Worker mới mở; (3) Đồng bộ Google Maps ngay trong tiến trình root Watchdog."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
