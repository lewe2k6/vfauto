name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.6.1-ts
          name: "Pin & Nhiệt Độ v4.6.1 Auto-Map Riêng Bike Chở Khách & Chống Bấm Xuyên 0.0/8 (TrollStore)"
          body: "Bản cập nhật v4.6.1: (1) Khóa cứng Auto-Tap nút tròn xanh 'Điều hướng' CHỈ chạy riêng cho chuyến Bike chở khách ('Hành khách' + 'Đã đến điểm đón' / 'Hoàn thành chuyến'), tự động bỏ qua không chạm Map đối với Express / Express 2H ghép đơn / Green Food (nhưng vẫn bảo vệ nối chuyến 100% không bao giờ tắt nhầm app khi đang chạy đơn giao hàng); (2) Giữ trọn cảm biến Pixel vồ nút Điều hướng tức thì kể cả khi bản đồ đứng yên 0 chuyển động + khóa chống bấm [X] xuyên xuống nút ⚠️ / 0.0/8 & tự đóng bảng lái xe liên tục."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
