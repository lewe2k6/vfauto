name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
            build/BanMap_TS.tipa
            build/BanMap_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.1.2-ts
          name: "Pin & Nhiệt Độ v5.1.2 + App Bắn Map Xanh Độc Lập (BanMap_TS)"
          body: "Bao gồm: (1) PinNhietDo_TS.tipa / .ipa v5.1.2 (Full Lọc Đơn + Bắn Map); (2) BanMap_TS.tipa / .ipa v1.0 (Bản độc lập chỉ có tính năng Bắn Google Map từ Xanh SM sang Máy 2 qua Bark APNs 0.2s + Ntfy để chia sẻ cho bạn bè, hoàn toàn không chứa code lọc đơn)."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
            build/BanMap_TS.tipa
            build/BanMap_TS.ipa
