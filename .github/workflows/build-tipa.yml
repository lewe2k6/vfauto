name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0-ts
          name: "Pin & Nhiệt Độ v5.0 — Chống Đơ Wi-Fi iPhone 8 2GB & Cầu Nối Bắn Map Sang Máy Thứ 2"
          body: "Bản nâng cấp v5.0: (1) Xóa bỏ hoàn toàn tính năng Tự ấn nút Điều hướng (giữ nguyên nhận diện đang trong cuốc để hủy đơn Food nổ chồng chỉ bấm X); (2) Khắc phục triệt để bệnh iPhone 8 (2GB RAM) bắt Wi-Fi Hotspot mất mạng & kẹt icon thanh trạng thái: hạ Jetsam Worker xuống band 12 dưới mDNSResponder/wifid/SpringBoard, tự gọt RAM thông minh 128-135MB trên máy 2GB, cắt bỏ 15s quét AI thừa sau khi nhận Bike và giảm >73% tải XPC; (3) Tích hợp Cầu Nối Bắn Định Vị Map 0.2s: gỡ Google Maps trên iPhone 8, bấm 'Điều hướng' trong Xanh SM là tọa độ vệ tinh bắn thẳng sang máy thứ 2 (Android/iPhone 16) tự bung Google Maps dẫn đường xe máy kèm cơ chế xuyên lỗi DNS Hotspot qua Cloudflare 1.1.1.1."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
