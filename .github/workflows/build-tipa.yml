name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.1-ts
          name: "Pin & Nhiệt Độ v5.0.1 — Vá Văng App Mở Bảng Mật & Cầu Nối Bắn Map 0.2s"
          body: "Bản vá khẩn v5.0.1: (1) Sửa triệt để lỗi văng app khi ấn giữ 'Trạng thái Pin' do CIContext gọi Metal GPU trong môi trường platform-application trên iOS 16 — chuyển sang bộ vẽ QR C thuần chạy 100% trên RAM CPU (PureQRCode) không đụng CoreImage/Metal + bổ sung đầy đủ quyền AGX/IOGPU và chuyển dò Google Maps sang luồng phụ; (2) Giữ trọn toàn bộ nâng cấp v5.0: bỏ hẳn Auto-Tap Điều hướng, hạ Jetsam Worker xuống band 12 cứu Wi-Fi iPhone 8 2GB RAM, và bắn định vị Điều hướng sang máy thứ 2 trong 0.2s."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
