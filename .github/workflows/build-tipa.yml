name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.6-ts
          name: "Pin & Nhiệt Độ v5.0.6 — Tích Hợp Bark (Nổ Thông Báo Mở Google Maps 0.2s Trên iPhone Nhận Map)"
          body: "Bản v5.0.6 tích hợp Bark (api.day.app Apple APNs trực tiếp + vượt rào DNS 1.1.1.1/IP 43.155.109.24) song song cùng ntfy.sh: (1) Khi dùng iPhone làm máy nhận Map thứ 2, thông báo Bark nổ tức thì trong 0.2 giây (nhanh gấp 20 lần ntfy trên iOS); (2) Chạm thông báo Bark trên iPhone 2 nhảy thẳng vào app Google Maps dẫn đường (comgooglemaps://) không qua Safari; (3) Hỗ trợ đồng bộ Key Bark 1 chạm từ trang map.html trên iPhone 2 sang iPhone 8 không cần gõ tay."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
