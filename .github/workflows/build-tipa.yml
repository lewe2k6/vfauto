name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.6-ts
          name: "Pin & Nhiệt Độ v4.6 Nhạy Tức Thì Nút Điều Hướng & Chống Bấm Xuyên 0.0/8 (TrollStore)"
          body: "Bản cập nhật v4.6: (1) Sửa triệt để lỗi đợi đứng im không ấn nút tròn xanh 'Điều hướng': thêm cảm biến Pixel 0.01ms dò vòng tròn xanh dương (323, 278) tự đánh thức OCR ngay cả khi bản đồ đứng yên 0 chuyển động, bật Turbo 15s + giảm nghỉ sau Nhận chuyến từ 2.1s xuống 350ms, bỏ ràng buộc chữ 'Hành khách' để ăn cả Bike lẫn Express; (2) Diệt tận gốc lỗi bấm [X] hủy Green Food đâm xuyên xuống nút ⚠️ / 0.0/8 (335, 52) ở sảnh: thêm khóa Pixel sống 0.5ms sát trước khi hạ ngón tay, nâng chờ kiểm chứng sau [X] từ 380ms lên 620ms + giới hạn tối đa 1 nhịp bồi, và tự động hất đóng bảng '0.0/8 Bạn đã lái xe liên tục' để tắt nhận chuyến 100% không bao giờ bị kẹt."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
