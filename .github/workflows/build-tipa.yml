name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.9-ts
          name: "Pin & Nhiệt Độ v5.0.9 — Bản Vá Toàn Diện Quyền Sandbox UID 501 & Đồng Bộ Google Maps"
          body: "Bản v5.0.9 sửa triệt để 4 lỗi ngầm phát hiện khi rà soát toàn bộ mã nguồn: (1) Sửa lỗi tiến trình giao diện (uid=501) bị chặn quyền đọc /var/containers/Bundle/Application khiến nút Khôi Phục Icon Google Maps báo 'Không Tìm Thấy Bộ Cài' và token đồng bộ bị lệch; (2) Đợi đồng bộ (waitpid) khi gọi pind --restore-gmaps và --sync-gmaps-scheme; (3) Xóa nhánh trollstorehelper ghi file tạm _TrollStore gây xung đột với khối hoàn trả Info.plist; (4) Chuyển toàn bộ thao tác đăng ký LaunchServices về tiến trình root pind."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
