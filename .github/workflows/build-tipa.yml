name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.1.2-ts
          name: "Pin & Nhiệt Độ v5.1.2 — Khắc Phục Triệt Để Lỗi Treo/Ngủ Mát Sau Vài Cuốc & Đen Mắt OCR"
          body: "Bản v5.1.2 sửa triệt để 5 lỗi khiến Lõi Ngầm dừng chạy sau vài cuốc: (1) Sửa lỗi logic chết (!canScan && frontBid.length == 0) khiến pind bị kẹt vĩnh viễn ở Ngủ mát 0% Nhiệt sau khi Bắn Map / nhận cuộc gọi / mở Camera; (2) Xóa khóa mù OCR 6.0 giây ở CASE B và mở rộng cảm biến nút Nhận chuyến đọc xuyên cả thanh đếm ngược màu xanh đậm; (3) Xóa nhánh tự bịa nút Nhận chuyến trên màn hình đang giao hàng và reset retryCount về 0; (4) Gắn Canary chống đơ bộ đệm chụp màn hình IOSurface; (5) Dùng chung Metal CIContext chống rò RAM Vision và chặn tự sát tiến trình khi đang trong chuyến."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
