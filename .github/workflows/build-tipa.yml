name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.5-ts
          name: "Pin & Nhiệt Độ v5.0.5 — Tối Ưu Triệt Để Hiệu Năng & Mạng Internet Trên iPhone 8 (0% Lag)"
          body: "Bản v5.0.5 triệt tiêu toàn bộ 6 nguyên nhân gây lag mạng và tụt hiệu năng trên iPhone 8: (1) Chặn lặp lệnh registerApplication:/unregisterApplication: làm đơ lsd + nehelper + symptomsd gây nghẽn mạng Wi-Fi/4G; (2) Tắt 100% Apple Vision Neural Engine OCR khi đang ở sảnh chờ chưa nổ đơn (cảm biến pixel 0.01ms nhận diện trực tiếp nút Nguồn xanh ngọc); (3) Ngắt 100% lệnh chụp màn hình CARenderServerRenderDisplay khi đang dùng app ngoài (Safari, Zalo, Facebook, Màn hình chính); (4) Bỏ copy đúp 4MB VRAM IOSurface mỗi khung hình; (5) Bỏ quét lsd 5 giây/lần trong Watchdog; (6) Chống tự khởi động lại Worker liên tục gây giải nén lại DB 162.000 điểm."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
