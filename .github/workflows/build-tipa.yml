name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2-ts
          name: "Pin & Nhiệt Độ v3.2 Fix Quét Màn & Chạm iOS 16 (TrollStore)"
          body: "Bản v3.2 chuẩn iOS 16.3.1 iPhone 8: Đã thêm quyền QuartzCore global-capture + IOSurface + nâng trần RAM Jetsam 512MB cho Vision OCR + chuẩn hóa tín hiệu chạm STHIDEventGenerator iOS 16 + Nút Test Quét Màn & Đọc Chữ Sau 4 Giây."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
