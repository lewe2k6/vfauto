name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.5-ts
          name: "Pin & Nhiệt Độ v4.5 Khóa Lõi Ngầm Bất Tử Tuyệt Đối 24/7 (TrollStore)"
          body: "Bản cập nhật v4.5: Rà soát 100% mã nguồn & diệt tận gốc 6 nguyên nhân khiến Lõi Ngầm thỉnh thoảng tự tắt trên iOS 16: (1) Ghi file chuẩn PROTECTION_CLASS_D (NSFileProtectionNone) + đọc có retry chống lỗi khóa màn hình Passcode/TouchID làm Watchdog tưởng tắt công tắc tổng; (2) Gỡ trần tử thần Jetsam 64MB của Watchdog nâng lên 1024MB + cấm gọi LSApplicationWorkspace trong tiến trình root; (3) Double-spawn (--daemonize) tách hẳn Watchdog sang cha PID 1 (launchd) + nối /dev/null + CLOEXEC miễn nhiễm khi vuốt tắt app ngụy trang khỏi đa nhiệm; (4) Khóa flock liên tiến trình + kiểm tra PID chủ sở hữu trước khi unlink chống 2 luồng giẫm chân xóa nhầm PID; (5) Bọc @try/@catch toàn vòng lặp Worker + chặn SIGPIPE/SIGXCPU/SIGXFSZ; (6) Chống dội ghi file khi kéo thanh trượt."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
