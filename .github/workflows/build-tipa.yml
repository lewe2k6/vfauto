name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0-ts
          name: "Pin & Nhiệt Độ v4.0 Bất Tử + Siêu Mát + Khóa Chặt Food (TrollStore iOS 16)"
          body: "Bản nâng cấp lớn v4.0: (1) Đớp trọn Bike + Express + Express 2H, chỉ lọc riêng Green Food kèm hất banner thông báo & khóa xác nhận giá 2 khung hình chống nhầm Food 17k; (2) Kiến trúc 2 tầng Watchdog bất tử + chạm bồi kiểm chứng vòng kín chống trượt đơn trên iPhone 8 2GB; (3) Động cơ Smart-Sleep ngắt 100% nhiệt khi đang mở Google Maps/khóa máy."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
