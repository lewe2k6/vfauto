name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.4-ts
          name: "Pin & Nhiệt Độ v4.4 Xử Lý Nổ Đơn Liên Thanh & Chống Tắt App Khi Nối Chuyến (TrollStore)"
          body: "Bản cập nhật v4.4: (1) Nếu vừa bấm [X] hủy đơn Food mà tổng đài bắn liền 1 đơn Bike/Express/Food ngon khi chưa kịp tắt app -> Tự động ngắt quy trình tắt app ngay trong 0ms để vồ gọn đơn mới (hoặc nếu nổ tiếp Food bèo thứ 2 thì chém tiếp [X] rồi mới tắt app); (2) Khóa 3 lớp nhận diện đang trong chuyến xe (Bike, Express, Food, nối chuyến, hoặc đang xem Google Maps) -> Khi nổ đơn Food nối chuyến chỉ bấm [X] từ chối, tuyệt đối giữ nguyên cuốc xe đang chạy không bao giờ tắt app."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
