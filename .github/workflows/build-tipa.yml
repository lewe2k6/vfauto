name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.2-ts
          name: "Pin & Nhiệt Độ v5.0.2 — Bản Rà Soát Sạch Lỗi Toàn Diện (App + Daemon + Cầu Nối Map)"
          body: "Bản v5.0.2 rà soát và khóa sạch toàn bộ lỗi tiềm ẩn: (1) Sửa regex tọa độ bị cụt số 0 cuối từ React Native (vd 21.03,105.8) và tự bóc tách URL chứa ký tự đặc biệt/tiếng Việt không phụ thuộc NSURLComponents, chống nhầm tọa độ saddr xuất phát; (2) Chống xung đột pind tự xả RAM cắt ngang gói Bắn Map đang gửi + gửi trực tiếp 0ms ngay trong app kèm hàng đợi dự phòng trùng nonce; (3) Hồi quy Xanh SM 3 nhịp chống kẹt chuyển cảnh SpringBoard; (4) Chống rò rỉ cổng Mach port ở màn hình Pin, tách luồng phụ cho LaunchServices XPC, và bổ sung Bảng Phóng Xanh Toàn Màn Hình 1 chạm trên map.html vượt chặn cử chỉ Chrome Android."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
