name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.7-ts
          name: "Pin & Nhiệt Độ v5.0.7 — Khôi Phục Icon Google Maps Lên Màn Hình iPhone 8 & Giữ Icon 100% Khi Bắn Map"
          body: "Bản v5.0.7 sửa triệt để lỗi mất icon Google Maps trên màn hình chính iPhone 8: (1) Tự động khôi phục lại icon Google Maps đã bị ẩn ở các bản cũ ngay khi mở app (dùng registerApplicationDictionary chuẩn uicache TrollStore + SBReloadIconForIdentifier); (2) Không bao giờ gọi unregisterApplication làm ẩn icon Google Maps nữa — giữ nguyên icon Google Maps trên màn hình chính iPhone 8 24/7 kể cả khi đang bật Bắn Map sang máy thứ 2; (3) Thêm nút 1 chạm 'Khôi Phục Icon Google Maps Lên Màn Hình' tại mục số 3."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
