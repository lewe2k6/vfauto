name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.2-ts
          name: "Pin & Nhiệt Độ v4.2 Vá Đứt Điểm Treo Ngủ Mát Sáng-Chiều & Tự Hồi Phục Lõi (TrollStore)"
          body: "Bản vá lỗi khẩn cấp v4.2: (1) Sửa lỗi Chế độ Siêu Mát bị kẹt trạng thái 'App ngoài' do bitmask BackBoard (8|32=40), lớp phủ nút Home ảo AssistiveTouch/InputUI và kết nối XPC ngủ đông từ sáng tới chiều; (2) Tự động thay Worker mới sạch 100% trong 0.08s mỗi khi mở khóa máy sau >=3 phút + Cảm biến Pixel 0.2ms tự cưỡng chế đánh thức khi có bảng nổ đơn; (3) Lệnh --stop quyền root + kiểm tra tên tiến trình KERN_PROC_PID để không bao giờ phải cài lại app."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
