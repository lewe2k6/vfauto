name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Run Native Objective-C Verification Suite (GSMOrderPayloadSniffer, HanoiFoodFilterEngine & StealthStatusPillHUD)
        run: |
          clang -fobjc-arc -O2 -IShared -ISources/Daemon \
            scripts/verify_sniffer_suite.m \
            Sources/Daemon/GSMOrderPayloadSniffer.m \
            Sources/Daemon/HanoiFoodFilterEngine.m \
            Sources/Daemon/StealthStatusPillHUD.m \
            -framework Foundation -framework CoreGraphics -framework CoreText -framework QuartzCore -lz \
            -o build/Payload/PinNhietDo.app/verify_sniffer_suite
          ./build/Payload/PinNhietDo.app/verify_sniffer_suite
          rm -f build/Payload/PinNhietDo.app/verify_sniffer_suite

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
            build/BanMap_TS.tipa
            build/BanMap_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.3.0-ts
          name: "Pin & Nhiệt Độ v5.3.0 (Snipe kqueue 2 Pha + Dual-Strip Micro-OCR 15ms + 5 Khóa Chống Bấm Nhầm + Tối Ưu RAM/Mạng)"
          body: "Bao gồm: (1) PinNhietDo_TS.tipa / .ipa v5.3.0 (Tích hợp Quả 30: Kernel kqueue 2 Pha + Delta-Offset/Head-Tail WAL Reader + Hỗ trợ MDModels.GroupOrder đơn ghép + Pre-Evaluation Cache + Dual-Strip Micro-OCR 15ms + 5 Khóa Chống Bấm Nhầm + Tối ưu 0KB NSURLCache RAM & DoH Fast-Switch 180s); (2) BanMap_TS.tipa / .ipa v1.0."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
            build/BanMap_TS.tipa
            build/BanMap_TS.ipa
