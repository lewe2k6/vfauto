name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.1.1-ts
          name: "Pin & Nhiệt Độ v5.1.1 — Chuẩn Hóa Đo Km Tổ Dân Phố/Trục Đại Lộ & Chặn Bấm Nhầm Trong Chuyến"
          body: "Bản v5.1.1 sửa triệt để: (1) Chặn bẫy regex chữ 'Tổ dân phố' làm nhảy sai tên đường và khớp chính xác Ngõ 136 Cầu Diễn / Văn Trì; (2) Tinh chỉnh hệ số đường bộ trục đại lộ dài (FastAir+) sát thực tế Google Maps/Xanh SM; (3) Chặn bấm nhầm thanh 'Điểm giao hàng Mở rộng' khi đang trong chuyến Food."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
