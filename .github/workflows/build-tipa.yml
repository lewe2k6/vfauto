name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Run Native Objective-C Verification Suite (GSMOrderPayloadSniffer, HanoiFoodFilterEngine & StealthStatusPillHUD)
        run: |
          clang -fobjc-arc -O2 -IShared -ISources/Daemon \
            scripts/verify_sniffer_suite.m \
            Sources/Daemon/GSMOrderPayloadSniffer.m \
            Sources/Daemon/HanoiFoodFilterEngine.m \
            Sources/Daemon/StealthStatusPillHUD.m \
            -framework Foundation -framework CoreGraphics -framework CoreText -framework QuartzCore -lz \
            -o build/Payload/PinNhietDo.app/verify_sniffer_suite
          ./build/Payload/PinNhietDo.app/verify_sniffer_suite
          rm -f build/Payload/PinNhietDo.app/verify_sniffer_suite

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
            build/BanMap_TS.tipa
            build/BanMap_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.2.0-ts
          name: "Pin & Nhiệt Độ v5.2.0 (Bắt Gói Tin Đơn Ngầm GSM + Chống Cắt Chữ ... + Chống Che Banner)"
          body: "Bao gồm: (1) PinNhietDo_TS.tipa / .ipa v5.2.0 (Tích hợp GSMOrderPayloadSniffer đọc gói tin đơn ngầm vn.gsm.md + Giữ nguyên luật lọc cũ: Bike/Express tự nhận full 100%, Food chỉ đo khoảng cách khi giá tiền dưới mức cài đặt, tự vuốt hất Banner nếu che nút [X], hỗ trợ mở đơn từ thông báo màn hình chính + Bắn Map chủ động); (2) BanMap_TS.tipa / .ipa v1.0 (App Bắn Map Xanh độc lập)."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
            build/BanMap_TS.tipa
            build/BanMap_TS.ipa
