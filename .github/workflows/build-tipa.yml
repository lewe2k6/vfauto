name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "dist/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.3-ts
          name: "Pin & Nhiệt Độ v4.3 Vá Lỗi Kill App 3 Tầng, Chống Trôi Đơn & Mở Lại Vòng Kín (TrollStore)"
          body: "Bản vá v4.3: (1) Bổ sung đủ quyền frontboard/backboard terminateapplications + nâng cấp Kill App 3 tầng (FBSSystemService + BackBoard + kiểm chứng PID kernel SIGKILL / root --kill-pid) trị dứt điểm lỗi báo Kill giả trên iOS 16; (2) Chốt an toàn kép: cấm Tắt app/Kill app khi đang chạy cuốc nối chuyến và chỉ Kill sau khi đã xác nhận màn Offline ('Mở nhận chuyến') tránh trôi đơn ngầm; (3) Mở lại App Tài xế 3 tầng nhận biết khóa màn hình + bấm [Mở nhận chuyến] vòng kín kiểm chứng lên 'Đang trực tuyến' thật sự."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
