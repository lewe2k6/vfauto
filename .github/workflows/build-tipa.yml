name: Build PinNhietDo TrollStore TIPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-tipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install ldid for TrollStore Entitlements
        run: |
          brew install ldid

      - name: Compile App & Root Daemon (.tipa / .ipa)
        run: |
          make all
          ls -lh build/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PinNhietDo-TrollStore-Package
          path: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa

      - name: Publish Direct Download Release for Safari iPhone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1-ts
          name: "Pin & Nhiệt Độ v3.1 Full Combo (TrollStore iOS 16)"
          body: "Bản v3.1 chuẩn tọa độ iPhone 8: Lọc giá Green Food + Nghỉ 2 phút & Kill/Relaunch App + Auto Tap Điều hướng 2 pha (chốt mở khóa Xác nhận hoàn thành). Tải trực tiếp **PinNhietDo_TS.tipa** trên Safari -> Mở qua **TrollStore** -> Install."
          prerelease: false
          files: |
            build/PinNhietDo_TS.tipa
            build/PinNhietDo_TS.ipa
