name: Build Zygisk TikTok Wide 0.6x NDK Module

on:
  push:
    branches: [ "**" ]
    paths:
      - "ZygiskTikTokWide/**"
      - ".github/workflows/build-zygisk-tiktok-wide.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-zygisk-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Locate Pre-installed Android NDK
        id: ndk
        run: |
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME}}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          fi
          echo "NDK_DIR=$NDK_DIR"
          echo "ndk_dir=$NDK_DIR" >> $GITHUB_OUTPUT

      - name: Fetch Official Zygisk API v4 Header & Build Dobby (arm64-v8a)
        run: |
          curl -sSL https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp \
            -o ZygiskTikTokWide/jni/zygisk.hpp

          git clone --depth=1 https://github.com/jmpews/Dobby.git /tmp/Dobby
          cmake -S /tmp/Dobby -B /tmp/Dobby/build-arm64 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk_dir }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_BUILD_EXAMPLE=OFF \
            -DDOBBY_BUILD_TEST=OFF \
            -DDOBBY_DEBUG=OFF \
            -DPlugin.SymbolResolver=OFF
          cmake --build /tmp/Dobby/build-arm64 --target dobby_static -j$(nproc)
          cp /tmp/Dobby/include/dobby.h ZygiskTikTokWide/jni/dobby.h
          ls -lh /tmp/Dobby/build-arm64/libdobby.a

      - name: Compile Zygisk Native Module (arm64-v8a.so)
        run: |
          CXX="${{ steps.ndk.outputs.ndk_dir }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          mkdir -p ZygiskTikTokWide/module/zygisk
          "$CXX" -std=c++17 -O2 -fPIC -shared -fvisibility=hidden -fvisibility-inlines-hidden \
            -IZygiskTikTokWide/jni \
            ZygiskTikTokWide/jni/main.cpp \
            /tmp/Dobby/build-arm64/libdobby.a \
            -llog -ldl \
            -Wl,--gc-sections,-s \
            -o ZygiskTikTokWide/module/zygisk/arm64-v8a.so
          ls -lh ZygiskTikTokWide/module/zygisk/arm64-v8a.so

      - name: Package Magisk Zygisk Module ZIP
        run: |
          sed -i 's/\r$//' ZygiskTikTokWide/module/post-fs-data.sh ZygiskTikTokWide/module/module.prop ZygiskTikTokWide/module/META-INF/com/google/android/update-binary
          chmod +x ZygiskTikTokWide/module/post-fs-data.sh ZygiskTikTokWide/module/META-INF/com/google/android/update-binary
          cd ZygiskTikTokWide/module
          zip -r9 ../../TikTokWideNDK-arm64.zip .
          cd ../..
          ls -lh TikTokWideNDK-arm64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTokWideNDK-Magisk-Module
          path: TikTokWideNDK-arm64.zip

      - name: Publish Direct Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tiktok-wide-ndk-v1
          name: "TikTok Wide 0.6x NDK Zygisk Module (arm64)"
          body: "Zygisk native module hooking libcamera2ndk.so (ACameraManager_openCamera + getCameraCharacteristics) to redirect TikTok camera 0 -> Ultra-Wide 0.6x (ID 3) on Xiaomi Mi 9 SE."
          files: TikTokWideNDK-arm64.zip
